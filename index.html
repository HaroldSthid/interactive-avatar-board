<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Avatar Board</title>

  <!-- Google Fonts: cyberpunk-styled display + readable body font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Setup View: room/host setup, role selection -->
    <section id="view-setup" class="view" data-view="setup">
      <header class="view__header">
        <h1 class="brand">Interactive Avatar Board</h1>
        <p class="brand__subtitle">Choose how you want to join the session</p>
      </header>

      <div class="setup__roles">
        <form id="form-host" class="panel panel--host">
          <h2 class="panel__title">Host a Board (Teacher)</h2>
          <label class="field">
            <span class="field__label">Room ID</span>
            <input type="text" id="input-host-room" class="field__input" placeholder="Generated on start" readonly />
          </label>
          <label class="field">
            <span class="field__label">Question topic</span>
            <select id="input-topic" class="field__input" disabled>
              <option value="*">Loading topics…</option>
            </select>
          </label>
          <p id="host-topic-status" class="field__hint" aria-live="polite"></p>
          <button type="submit" id="btn-start-hosting" class="btn btn--primary" disabled>Start Hosting</button>
        </form>

        <form id="form-student" class="panel panel--student">
          <h2 class="panel__title">Join a Board (Student)</h2>
          <label class="field">
            <span class="field__label">Room ID</span>
            <input type="text" id="input-join-room" class="field__input" placeholder="e.g. ROOM123" required />
          </label>
          <label class="field">
            <span class="field__label">Student ID</span>
            <input type="text" id="input-student-id" class="field__input" placeholder="Your Student ID" required />
          </label>
          <label class="field">
            <span class="field__label">Avatar</span>
            <div class="field--avatar-picker">
              <img id="avatar-preview" src="avatars/hero-knight.jpg" alt="" class="avatar-preview" />
              <select id="input-avatar" class="field__input">
                <option value="hero-knight">Hero Knight</option>
                <option value="shadow-ninja">Shadow Ninja</option>
                <option value="cyber-mage">Cyber Mage</option>
                <option value="star-ranger">Star Ranger</option>
              </select>
            </div>
          </label>
          <label class="field">
            <span class="field__label">O subí tu foto (JPG, opcional)</span>
            <input type="file" id="input-avatar-upload" class="field__input" accept="image/jpeg" />
          </label>
          <p id="avatar-upload-status" class="field__hint" aria-live="polite"></p>
          <button type="submit" class="btn btn--secondary">Join Board</button>
        </form>
      </div>
    </section>

    <!-- Board View: teacher/host race dashboard -->
    <section id="view-board" class="view" data-view="board" hidden>
      <header class="view__header">
        <h1 class="brand brand--small">Race Board</h1>
        <div class="board__meta">
          <span id="board-room-id" class="badge">Room: --</span>
          <span id="board-topic" class="badge" hidden></span>
          <button id="btn-back-to-setup-board" class="btn btn--ghost">Exit</button>
        </div>
      </header>

      <div id="board-controls" class="board-controls">
        <span id="board-state" class="badge badge--state">State: LOBBY</span>
        <label class="field field--inline">
          <span class="field__label">Correct Answer</span>
          <select id="input-correct-answer" class="field__input">
            <option value="">--</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </label>
        <!-- Alias rule: host-side, per session; locked once the game leaves the LOBBY. -->
        <div id="alias-rule" class="alias-rule">
          <label class="field field--inline">
            <span class="field__label">Alias rule</span>
            <select id="input-alias-mode" class="field__input">
              <option value="any">Any alias</option>
              <option value="prefix">Student ID prefix</option>
              <option value="custom">Custom regex</option>
            </select>
          </label>
          <label id="alias-digits-field" class="field field--inline" hidden>
            <span class="field__label">Digits</span>
            <input type="number" id="input-alias-digits" class="field__input alias-rule__digits" min="1" max="20" value="10" />
          </label>
          <label id="alias-regex-field" class="field field--inline" hidden>
            <span class="field__label">Regex</span>
            <input type="text" id="input-alias-regex" class="field__input" placeholder="^\d{10}_.+$" spellcheck="false" />
          </label>
          <span id="alias-rule-hint" class="alias-rule__hint" aria-live="polite"></span>
        </div>
        <!-- Auto-advance: after a TIMER-expired question, wait a leaderboard dwell then start the next one. -->
        <div id="auto-advance" class="alias-rule">
          <label class="field field--inline">
            <input type="checkbox" id="input-auto-advance" checked />
            <span class="field__label">Auto-advance</span>
          </label>
          <label class="field field--inline">
            <span class="field__label">Seconds</span>
            <input type="number" id="input-auto-advance-seconds" class="field__input alias-rule__digits" min="3" max="60" value="8" />
          </label>
        </div>
        <button id="btn-toggle-simulator" type="button" class="btn btn--ghost">Simulator: Off</button>
        <button id="btn-start-game" type="button" class="btn btn--primary">Start Game</button>
        <button id="btn-next-question" type="button" class="btn btn--secondary" disabled>Next Question</button>
        <button id="btn-end-session" type="button" class="btn btn--ghost" disabled>Finalizar sesión</button>
        <button id="btn-start-bonus" type="button" class="btn btn--primary" disabled>Start Bonus Round</button>
        <button id="btn-end-bonus" type="button" class="btn btn--ghost" disabled>Finalizar ronda bonus</button>
        <button id="btn-reset-game" type="button" class="btn btn--ghost">Reset</button>
      </div>

      <div id="board-timer" class="timer-bar" hidden>
        <div id="board-timer-fill" class="timer-bar__fill"></div>
        <span id="board-timer-count" class="timer-bar__count"></span>
      </div>

      <span id="board-auto-advance" class="badge badge--state" aria-live="polite" hidden></span>

      <div id="board-track" class="board-track">
        <div id="board-starting-line" class="board-starting-line" aria-label="Waiting area"></div>

        <div id="board-grid" class="board-grid">
          <div class="quadrant" data-quadrant="A">
            <span class="quadrant__label">A</span>
            <div class="quadrant__lane"></div>
          </div>
          <div class="quadrant" data-quadrant="B">
            <span class="quadrant__label">B</span>
            <div class="quadrant__lane"></div>
          </div>
          <div class="quadrant" data-quadrant="C">
            <span class="quadrant__label">C</span>
            <div class="quadrant__lane"></div>
          </div>
          <div class="quadrant" data-quadrant="D">
            <span class="quadrant__label">D</span>
            <div class="quadrant__lane"></div>
          </div>
        </div>
      </div>

      <div id="board-leaderboard" class="board-leaderboard" aria-label="Round leaderboard" hidden></div>

      <div id="board-final-ranking" class="board-leaderboard board-final-ranking" aria-label="Final session ranking" hidden></div>

      <!-- Husky Bonus Round: live leaderboard (BONUS_ROUND) and champion
           reveal (BONUS_RESULTS) share this one panel — see
           renderBonusLeaderboard()/renderBonusChampionReveal() in app.js. -->
      <div id="board-bonus-leaderboard" class="board-leaderboard board-bonus-leaderboard" aria-label="Bonus round leaderboard" hidden></div>

      <div id="board-roster" class="board-roster" aria-label="Connected students"></div>
    </section>

    <!-- Controller View: student answer submission -->
    <section id="view-controller" class="view" data-view="controller" hidden>
      <header class="view__header">
        <h1 class="brand brand--small">Controller</h1>
        <div class="board__meta">
          <span id="controller-student-tag" class="badge">Student: --</span>
          <button id="btn-back-to-setup-controller" class="btn btn--ghost">Exit</button>
        </div>
      </header>

      <div id="controller-question" class="controller-question">
        <p id="controller-question-text" class="controller-question__text">Waiting for the host to start a question&hellip;</p>
        <div id="controller-timer" class="timer-bar" hidden>
          <div id="controller-timer-fill" class="timer-bar__fill"></div>
          <span id="controller-timer-count" class="timer-bar__count"></span>
        </div>
      </div>

      <div id="controller-grid" class="controller-grid">
        <button type="button" class="controller-option" data-choice="A">A</button>
        <button type="button" class="controller-option" data-choice="B">B</button>
        <button type="button" class="controller-option" data-choice="C">C</button>
        <button type="button" class="controller-option" data-choice="D">D</button>
      </div>

      <!-- Husky Bonus Round: shown/hidden by app.js in place of #controller-grid
           for finalists only (BONUS_START handler in handleClientMessage()).
           Non-finalists stay on #controller-question-text (spectator message,
           tasks.md 5.3) and never see this canvas. Backing-store size and DPR
           scaling are set by bonus-round.js's initCanvas() at start() time,
           not here — see style.css for the responsive display size. -->
      <div id="controller-bonus" class="controller-bonus" hidden>
        <canvas id="bonus-canvas" class="controller-bonus__canvas"></canvas>
      </div>
    </section>
  </div>

  <script src="bonus-round.js"></script>
  <script src="quiz-rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
